<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exhibition — Ashwood Museum</title>
<meta name="description" content="Exhibition at the Ashwood Museum of Art & History.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 44'%3E%3Cpath d='M2 43V17C2 9 9 3 17 1c8 2 15 8 15 16v26z' fill='%2313261D' stroke='%23E2BF62' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.exh-hero {
    position: relative;
    padding: calc(var(--header-h) + 70px) 0 110px;
    background:
        radial-gradient(ellipse at 75% 30%, rgba(226,191,98,0.18), transparent 55%),
        linear-gradient(160deg, var(--forest) 0%, var(--forest-deep) 55%, var(--forest-night) 100%);
    color: var(--marble);
    overflow: hidden;
}
.exh-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 80px; align-items: center; position: relative; z-index: 1; }
.exh-hero .back { color: var(--sea-glass); font-family: var(--font-label); font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
.exh-hero .back:hover { color: var(--marble); }
.exh-status {
    display: inline-block;
    margin-top: 34px;
    font-family: var(--font-label);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 7px 14px;
    border: 1px solid var(--gold);
    color: var(--gold-bright);
    border-radius: 999px;
}
.exh-hero h1 { color: var(--marble); font-size: clamp(54px, 7.5vw, 104px); line-height: 1; margin-top: 18px; }
.exh-sub { font-family: var(--font-display); font-style: italic; font-size: clamp(24px, 2.6vw, 32px); color: rgba(247,243,234,0.85); margin-top: 8px; }
.exh-facts { margin-top: 34px; display: flex; flex-direction: column; gap: 10px; font-size: 18px; }
.exh-facts .k { font-family: var(--font-label); font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-bright); display: inline-block; width: 110px; }
.exh-art { aspect-ratio: 4 / 5; max-height: 620px; box-shadow: var(--shadow-lg); }

.exh-body { display: grid; grid-template-columns: 1.5fr 1fr; gap: 80px; align-items: start; }
.exh-text p { font-size: 20px; line-height: 1.8; color: var(--ink-soft); }
.exh-text p + p { margin-top: 22px; }
.exh-text p:first-child::first-letter {
    font-family: var(--font-heading); font-variation-settings: 'opsz' 14;
    font-weight: 700;
    float: left;
    font-size: 86px;
    line-height: 0.8;
    padding: 8px 6px 0 0;
    color: var(--forest);
}
.exh-side { position: sticky; top: calc(var(--header-h) + 30px); display: flex; flex-direction: column; gap: 22px; }
.side-card { background: #FFFDF8; border: 1px solid var(--line); border-radius: 2px; padding: 28px; }
.side-card h3 { font-size: 30px; margin: 6px 0 10px; }
.side-card p { color: var(--ink-soft); font-size: 17px; }
.side-card .btn { margin-top: 18px; width: 100%; }
.side-card .btn + .btn { margin-top: 10px; }
.side-map svg { width: 100%; height: auto; display: block; margin-top: 14px; }
.side-map .map-label { font-family: var(--font-display); font-weight: 600; font-size: 20px; color: var(--ink); margin-top: 4px; }

@media (max-width: 900px) {
    .exh-grid, .exh-body { grid-template-columns: 1fr; gap: 50px; }
    .exh-art { max-width: 460px; }
    .exh-side { position: static; }
}
@media (max-width: 640px) {
    .exh-hero { padding-top: calc(var(--header-h) + 40px); }
    .exh-facts { font-size: 16.5px; }
    .exh-facts .k { display: block; width: auto; }
    .exh-text p { font-size: 18.5px; }
}
</style>
</head>
<body data-page="exhibitions">

<header id="siteHeader"></header>

<main id="exRoot">
    <section class="exh-hero">
        <div class="container exh-grid">
            <div>
                <a href="exhibitions.html" class="back">&larr; All Exhibitions</a><br>
                <span class="exh-status" id="exStatus"></span>
                <h1 id="exTitle"></h1>
                <p class="exh-sub" id="exSubtitle"></p>
                <div class="exh-facts">
                    <div><span class="k">Dates</span><span id="exDates"></span></div>
                    <div><span class="k">Where</span><span id="exWhere"></span></div>
                </div>
            </div>
            <div class="art-media arch cover exh-art" id="exHeroArt"></div>
        </div>
        <div data-arcade></div>
    </section>

    <section class="section">
        <div class="container exh-body">
            <div>
                <span class="eyebrow">About the Exhibition</span>
                <div data-ornament class="left"></div>
                <div class="exh-text" id="exBody"></div>
            </div>
            <aside class="exh-side">
                <div class="side-card">
                    <span class="eyebrow">Visit</span>
                    <h3>Admission</h3>
                    <div id="exCta"></div>
                </div>
                <div class="side-card side-map">
                    <span class="eyebrow">Find It</span>
                    <p class="map-label" id="exMapLabel"></p>
                    <div id="exMap"></div>
                </div>
            </aside>
        </div>
    </section>

    <section class="section alt" id="exWorksSection">
        <div class="container">
            <div class="section-head">
                <div>
                    <span class="eyebrow">In the Exhibition</span>
                    <h2>Selected Works</h2>
                </div>
                <a href="collection.html" class="text-link">The Full Collection &rarr;</a>
            </div>
            <div class="art-grid" id="exWorks"></div>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="section-head">
                <div>
                    <span class="eyebrow">Also at Ashwood</span>
                    <h2>More Exhibitions</h2>
                </div>
                <a href="exhibitions.html" class="text-link">All Exhibitions &rarr;</a>
            </div>
            <div class="ex-grid" id="exOthers"></div>
        </div>
    </section>
</main>

<footer id="siteFooter"></footer>

<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/script.js"></script>
</body>
</html>
