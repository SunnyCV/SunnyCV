<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events — Ashwood Museum</title>
<meta name="description" content="Talks, tours, concerts, family days and workshops at the Ashwood Museum.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 44'%3E%3Cpath d='M2 43V17C2 9 9 3 17 1c8 2 15 8 15 16v26z' fill='%2313261D' stroke='%23E2BF62' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.ev-filters {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    margin: 36px auto 0; position: relative; z-index: 2;
    width: fit-content; max-width: calc(100% - 40px);
    background: var(--marble); padding: 6px; border: 1px solid var(--line); border-radius: 30px; box-shadow: var(--shadow);
}
.ev-filter {
    font-family: var(--font-label); font-size: 12px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase;
    padding: 12px 20px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-soft); cursor: pointer;
}
.ev-filter:hover { color: var(--forest); }
.ev-filter.active { background: var(--forest); color: var(--marble); }

.ev-list { max-width: 980px; margin: 0 auto; padding: 60px 0 120px; }
.ev-month { font-size: 44px; margin: 50px 0 10px; padding-bottom: 14px; border-bottom: 2px solid var(--gold); }
.ev-month:first-child { margin-top: 0; }
.ev-card {
    display: grid; grid-template-columns: auto 1fr auto; gap: 30px; align-items: start;
    padding: 30px 0; border-bottom: 1px solid var(--line);
    scroll-margin-top: calc(var(--header-h) + 30px);
    transition: background-color 1.2s;
}
.ev-card.flash { background: rgba(226,191,98,0.16); }
.ev-card h3 { font-family: var(--font-display); font-weight: 600; font-size: 28px; color: var(--ink); margin-top: 4px; }
.ev-card .ev-body > p { color: var(--ink-soft); margin-top: 6px; font-size: 17.5px; }
.ev-card .ev-body > p.ev-facts { margin-top: 12px; font-size: 15.5px; color: var(--ink-soft); }
.ev-facts .sep { color: var(--gold-deep); margin: 0 9px; }
.ev-facts strong { color: var(--forest); font-weight: 500; white-space: nowrap; }
.ev-cta { padding-top: 6px; }
.ev-register { margin-top: 20px; }
.ev-form { display: grid; grid-template-columns: 1fr 1fr 110px auto; gap: 12px; align-items: end; padding: 20px; background: var(--marble-2); border-radius: 2px; }
.ev-form .field input, .ev-form .field select { padding: 11px 12px; font-size: 16px; }
.ev-form .field select { padding-right: 34px; }
.ev-form .btn { padding: 13px 20px; }
.ev-form .err { position: absolute; }
.ev-form .field { position: relative; }
.ev-done { padding: 16px 18px; background: var(--moss-soft); border-left: 3px solid var(--moss); color: var(--forest-deep); font-size: 17px; }
.ex-empty { text-align: center; color: var(--ink-soft); font-size: 20px; padding: 40px 0; }

@media (max-width: 760px) {
    .ev-card { grid-template-columns: auto 1fr; gap: 20px; }
    .ev-cta { grid-column: 2; padding-top: 0; }
    .ev-form { grid-template-columns: 1fr 1fr; }
    .ev-form .field:first-child, .ev-form .field:nth-child(2) { grid-column: 1 / -1; }
    .ev-form .err { position: static; }
}
@media (max-width: 640px) {
    .ev-filters { justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; border-radius: 999px; scrollbar-width: none; }
    .ev-filters::-webkit-scrollbar { display: none; }
    .ev-filter { white-space: nowrap; padding: 11px 15px; font-size: 11px; }
    .ev-month { font-size: 36px; }
    .ev-card { gap: 16px; }
    .ev-card h3 { font-size: 22px; }
    .ev-card .ev-date { width: 62px; }
    .ev-card .ev-date strong { font-size: 30px; }
}
</style>
</head>
<body data-page="events">

<header id="siteHeader"></header>

<main>
    <section class="page-hero">
        <div class="container">
            <span class="eyebrow light">Talks · Tours · Music · Family</span>
            <h1>Events</h1>
            <p>Candlelit choirs, curators’ walks and Saturday mornings among the armor. There’s always something happening in the galleries.</p>
        </div>
        <div data-arcade></div>
    </section>

    <div class="ev-filters" id="evFilters" role="group" aria-label="Filter events"></div>

    <div class="container">
        <div class="ev-list" id="evList"></div>
    </div>
</main>

<footer id="siteFooter"></footer>

<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/script.js"></script>
</body>
</html>
